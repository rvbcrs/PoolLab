; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = LVGL-320-480
default_envs = esp32-s3-35
boards_dir = boards
data_dir = data
lib_dir = libraries
src_dir = src

[env:esp32-c6-147]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
lib_deps = 
    moononournation/GFX Library for Arduino @ ^1.5.9
    knolleary/PubSubClient @ ^2.8
    lvgl/lvgl @ ^8.4.0
    links2004/WebSockets @ ^2.3.7
lib_ignore = 
    axs15231b
    JC3248W535 BSP
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
board_build.partitions = partitions/ota_zigbee_4MB.csv
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D LV_CONF_INCLUDE_SIMPLE
	-I src
	-D BOARD_ESP32C6_TOUCH_1_47
	-D HAS_ZIGBEE=1
	-D ZIGBEE_MODE_ZCZR
	-L $HOME/.platformio/packages/framework-arduinoespressif32-libs/esp32c6/lib
	-lesp_zb_api.zczr
	-lzboss_stack.zczr
	-D FORCE_ZIGBEE=1
	-D CORE_DEBUG_LEVEL=3
	-D PH_ON_MOTOR_A=1
	-D M1_DIR_A=0
	-D M2_DIR_A=1
	; --- ADS1115 (default) ---
	-D USE_ADS1115=1
	-D ADS_ADDR=0x48
	-D ADS_SDA=18
	-D ADS_SCL=19
	-D ADS_CH_PH=0
	-D ADS_CH_ORP=1
	; --- Analog PH/ORP sensors (optional, use instead of ADS1115) ---
	; -D USE_ANALOG_SENSORS=1
	; -D PH_ADC_PIN=0
	; -D ORP_ADC_PIN=7
extra_scripts = 
	pre:scripts/clean_ds_store.py

[env:esp32-s3-35]
platform = espressif32
#board = esp32-s3-devkitc-1
board = 320x480
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	knolleary/PubSubClient @ ^2.8
	links2004/WebSockets @ ^2.3.7
	lvgl/lvgl @ ^8.4.0
	jandrassy/TelnetStream @ ^1.2.4
	# https://github.com/schreibfaul1/ESP32-audioI2S.git
	#jc3248w535
lib_ignore = 
	Zigbee
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-I src
	-I libraries
	-D LV_CONF_INCLUDE_SIMPLE
	-D USE_JC3248W535
	-D USE_TELNET_STREAM
	-D BOARD_ESP32S3_35
	-D HAS_ZIGBEE=0
	-D EXAMPLE_PIN_NUM_QSPI_TE=-1
	-D CORE_DEBUG_LEVEL=3
	-D PH_ON_MOTOR_A=1
	-D M1_DIR_A=0
	-D M2_DIR_A=1
	; Enable BSP touch with new I2C driver
	; --- ADS1115 disabled on S3 to avoid mixing old/new I2C drivers in BSP path ---
	-D USE_ADS1115=0
	-D ADS_ADDR=0x48
	-D ADS_SDA=18
	-D ADS_SCL=19
	-D ADS_CH_PH=0
	-D ADS_CH_ORP=1
	; --- Analog PH/ORP sensors (disabled until physically connected) ---
	-D USE_ANALOG_SENSORS=0
	-D PH_ADC_PIN=6
	-D ORP_ADC_PIN=7

[env:esp32-p4-43]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
; Back to full PoolLab code (landscape mode enabled)
; build_src_filter = +<main_p4_rotation_test.cpp> -<main.cpp>
build_src_filter = +<*> -<core/DisplayBridge.cpp>
lib_extra_dirs = lib_p4
lib_deps = 
	knolleary/PubSubClient @ ^2.8
	lvgl/lvgl @ ^8.4.0
	links2004/WebSockets @ ^2.3.7
lib_ignore = 
	axs15231b
	JC3248W535 BSP
	GFX Library for Arduino
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D LV_CONF_INCLUDE_SIMPLE
	-I src
	-I lib_p4/st7701_lcd
	-I lib_p4/gt911_touch
	-D BOARD_ESP32P4_43
	; P4 uses C6 for Zigbee via UART/I2C bridge, not native Zigbee
	-D HAS_ZIGBEE=0
	-D CORE_DEBUG_LEVEL=3
	-D PH_ON_MOTOR_A=1
	-D M1_DIR_A=0
	-D M2_DIR_A=1
	; --- P4 uses I2C for touch (GPIO 7/8), keep ADS on different pins if needed ---
	-D USE_ADS1115=0
	-D ADS_ADDR=0x48
	-D ADS_SDA=6
	-D ADS_SCL=10
	-D ADS_CH_PH=0
	-D ADS_CH_ORP=1
	; --- Analog PH/ORP sensors (optional) ---
	; -D USE_ANALOG_SENSORS=1
	; -D PH_ADC_PIN=0
	; -D ORP_ADC_PIN=1